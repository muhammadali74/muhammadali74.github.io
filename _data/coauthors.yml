# Maps co-author surnames to first-name variants and a profile link.
# jekyll-scholar uses this to hyperlink co-author names in the publications list.
# Entries without a `url` have no effect, so only add a co-author once you have
# a page to point at. Example:
#
# "sajid":
#   - firstname: ["Hammad", "H."]
#     url: https://example.com/hammad-sajid
