- title: Experience
  type: time_table
  contents:
    - title: AI and Robotics Engineer (R&D)
      institution: <a href="https://farmevo.ai/">Farmevo Technologies</a>, Karachi, Pakistan
      year: March 2026 - Present
      description:
        - Leading the design and development of the software stack for a quadruped-based autonomous sensing platform, integrating real-time navigation, localization, multimodal sensing, perception, and data recording for tree analytics and forest inventory workflows.
        - Developing a LiDAR-camera 3D reconstruction pipeline using point-based registration and LiDAR odometry/SLAM to generate accurate 3D representations of forest environments.
        - Benchmarked 3D tree segmentation and parameter-estimation tools, evaluating ForestFormer3D, SegmentAnyTree, TreeLearn, and PointNet++ on curated forestry datasets, and developing the pipeline for precise carbon stock estimation.
        - Implemented camera-LiDAR fusion for point-cloud colorization and 2D-3D mask association, enabling integration of visual and geometric information for tree segmentation and downstream parameter estimation.
        - Contributed to mechanical and electrical integration of the quadruped forestry sensing platform, including sensor selection, CAD design, 3D printing, and assembly of the onboard computer and multimodal sensor stack.
        - Supervising an FYP research project on 2D tree segmentation and bark-texture-based species detection.
    - title: Autonomous Vehicle Algorithms Engineer
      institution: <a href="https://covolv.ai/">Covolv.ai</a>, Karachi, Pakistan
      year: June 2025 - March 2026
      description:
        - Architected and optimized a real-time multi-camera BEV perception pipeline in ROS 2, fusing 6 synchronized camera streams via composable nodes and multithreaded execution to process high-resolution inputs at 25 FPS on an embedded platform.
        - Fine-tuned vision-based deep learning models for multi-object detection in L2+ autonomous driving across highway driving and autonomous parking; developed an oriented bounding-box CNN for parking-slot detection and owned the pipeline from data curation through training and evaluation.
        - Engineered an inference pipeline for vehicle AI workloads, offloading neural-network inference from GPU to the Hexagon Tensor Processor and achieving an 87% improvement in end-to-end inference performance.
        - Optimized CNN perception models for HTP deployment through post-training quantization, and developed model-analysis tooling to quantify layer-wise sensitivity to quantization and guide mixed-precision deployment decisions.
        - Designed camera intrinsic and camera-to-camera extrinsic calibration workflows using the MATLAB Calibration Toolbox for accurate multi-view geometric alignment and BEV projection.
        - Developed a differentiable ISP-based domain adaptation pipeline to improve perception robustness across heterogeneous camera sensors and low-light conditions, recovering 80-90% of performance lost under photometric degradation.
    - title: Teaching Assistant
      institution: Habib University, Karachi, Pakistan
      year: August 2022 - April 2025
      description:
        - Selected as a Teaching Assistant for 6 courses across CS, mathematics, and AI, including Deep Learning, Algorithm Design & Analysis, Computer Architecture, Linear Algebra, Discrete Mathematics, and Programming Fundamentals.
        - Conducted labs, recitations, and office hours, and designed, evaluated, and graded coursework.
        - Awarded Best Teaching Assistant (Spring 2024) by Habib University's Office of Career Services.
    - title: Undergraduate Research Assistant
      institution: Habib University, Karachi, Pakistan
      year: September 2024 - April 2025
      description:
        - Built an end-to-end computational pipeline for CRISPR-Cas13b guide RNA design against all four Dengue virus serotypes, processing and quality-filtering 38,057 viral genomes and extracting 3.78M unique 30-nt candidate spacers for conservation analysis.
        - Designed a memory-efficient sequence-analysis workflow and Cas13b-specific optimization algorithm that improved the potency score of 98.5% of 1,740 candidates by 47.17 points on average.
        - Developed and benchmarked ML models for Cas13b targeting-efficiency prediction, comparing XGBoost and other classical models against Nucleotide Transformer and RNA-FM foundation-model embeddings.
        - Built a multi-objective ranking framework producing 269-396 high-confidence crRNA candidates per serotype suitable for experimental validation.
    - title: Summer Research Intern
      institution: Texas A&M University, College Station, Texas, USA
      year: May 2024 - July 2024
      description:
        - Implemented and benchmarked a state-of-the-art spectral calibration method for Swept-Source Optical Coherence Tomography (SS-OCT), establishing baselines for comparative evaluation.
        - Developed a deep learning-based spectral calibration pipeline using LSTM networks, improving robustness to jitter noise and downsampling and reducing calibration error to 12%.

